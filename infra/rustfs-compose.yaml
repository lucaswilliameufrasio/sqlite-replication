services:
  rustfs:
    image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    environment:
      RUSTFS_ACCESS_KEY: test
      RUSTFS_SECRET_KEY: test
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
    ports:
      - "127.0.0.1:${RUSTFS_PORT:?set RUSTFS_PORT}:9000"
    volumes:
      - rustfs-data:/data
    command: ["/data"]

volumes:
  rustfs-data:
