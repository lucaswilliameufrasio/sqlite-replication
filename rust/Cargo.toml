[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/ltx",
    "crates/sqlite-adapter",
    "crates/spool",
    "crates/storage-fs",
    "crates/storage-s3",
    "crates/wal",
]

[workspace.package]
edition = "2024"
rust-version = "1.94.1"
license = "Apache-2.0"

[workspace.dependencies]
hex = "0.4.3"
lz4_flex = { version = "0.14.0", features = ["frame"] }
rusqlite = { version = "0.41.1", default-features = false, features = ["backup", "bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.0", features = ["serde", "v4"] }
tempfile = "3.27.0"
tokio = { version = "=1.54.1", features = ["fs", "io-util", "macros", "rt-multi-thread"] }
sha2 = "0.11.1"
aws-sdk-s3 = "=1.157.0"
aws-credential-types = "=1.3.1"
