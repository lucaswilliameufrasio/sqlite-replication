[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/ltx",
    "crates/sqlite-adapter",
    "crates/spool",
    "crates/storage-fs",
    "crates/storage-s3",
    "crates/wal",
]

[workspace.package]
edition = "2024"
rust-version = "1.94.1"
license = "Apache-2.0"

[workspace.dependencies]
hex = "0.4.3"
lz4_flex = { version = "0.14.0", features = ["frame"] }
# 0.39.0 is the newest rusqlite whose libsqlite3-sys 0.37.0 (SQLite 3.51.3)
# still links in one binary with sqlx 0.9. This workspace may stay on 0.41.1.
rusqlite = { version = ">=0.39.0, <=0.41.1", default-features = false, features = ["backup", "bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.0", features = ["serde", "v4"] }
tempfile = "3.27.0"
tokio = { version = "=1.54.1", features = ["fs", "io-util", "macros", "rt-multi-thread"] }
sha2 = "0.11.1"
aws-sdk-s3 = { version = "=1.157.0", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-credential-types = "=1.3.1"
