[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/ltx",
    "crates/sqlite-adapter",
    "crates/spool",
    "crates/storage-fs",
    "crates/wal",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
lz4_flex = { version = "0.13.0", features = ["frame"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["backup", "bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18", features = ["serde", "v4"] }
tempfile = "3.23"
