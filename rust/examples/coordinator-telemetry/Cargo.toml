[package]
name = "sqlite-replication-coordinator-telemetry-example"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
opentelemetry = { version = "=0.33.1", default-features = false, features = ["metrics", "trace"] }
prometheus = "=0.14.0"
sqlite-replication-core = { path = "../../crates/core" }

[dev-dependencies]
opentelemetry_sdk = { version = "=0.33.1", features = ["testing"] }
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled"] }
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread"] }
